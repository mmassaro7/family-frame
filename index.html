<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" id="vp" content="width=1280, initial-scale=1, user-scalable=no">
  <script>
    // Phones get their own layout (css/phone.css): the page follows the phone's width instead of the
    // frame's fixed 1280 x 800 stage. The frame's short side is 800, a phone's is about 360-430.
    (function () {
      if (Math.min(screen.width, screen.height) >= 600 && !/[?&]phone=1/.test(location.search)) return;
      document.documentElement.className += ' phone';
      document.getElementById('vp').setAttribute('content', 'width=device-width, initial-scale=1, viewport-fit=cover');
    })();
  </script>
  <meta name="theme-color" content="#F2EEE6">
  <title>Family Frame</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&family=Bangers&family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/views/home.css">
  <link rel="stylesheet" href="css/views/calendar.css">
  <link rel="stylesheet" href="css/views/shopping.css">
  <link rel="stylesheet" href="css/views/todo.css">
  <link rel="stylesheet" href="css/views/holidays.css">
  <link rel="stylesheet" href="css/views/weather.css">
  <link rel="stylesheet" href="css/views/stocks.css">
  <link rel="stylesheet" href="css/views/photos.css">
  <link rel="stylesheet" href="css/views/ambient.css">
  <link rel="stylesheet" href="css/phone.css">
</head>
<body>
  <div class="stage" id="stage" data-mode="day">
    <nav class="rail" id="rail" aria-label="Sections">
      <button class="rail-item" data-go="home"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Today</span></button>
      <button class="rail-item" data-go="calendar"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
      <button class="rail-item" data-go="shopping"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 11h10.8L21 8H6.5"/><circle cx="10" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg><span>Shopping</span></button>
      <button class="rail-item" data-go="todo"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.2 4.4l6.4 6.4-2.8 2.8-6.4-6.4z"/><path d="M13.6 10.4L5 19"/></svg><span>To Do</span></button>
      <button class="rail-item" data-go="weather"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 2.5v1.3M3.4 4.6l.9.9M1.8 9.6h1.3M13.6 4.6l-.9.9"/><path d="M5.3 12.3a4 4 0 0 1 6.9-4.4"/><path d="M9.5 20h8.3a3.6 3.6 0 0 0 .4-7.2A5 5 0 0 0 8.6 13.7 3.2 3.2 0 0 0 9.5 20z"/></svg><span>Weather</span></button>
      <button class="rail-item" data-go="stocks"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/></svg><span>Stocks</span></button>
      <button class="rail-item" data-go="photos"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg><span>Photos</span></button>
      <div class="rail-clock" id="railClock" aria-label="Clock"></div>
    </nav>

    <main class="views">
      <section class="view" id="view-home" data-view="home"></section>
      <section class="view" id="view-calendar" data-view="calendar"></section>
      <section class="view" id="view-shopping" data-view="shopping"></section>
      <section class="view" id="view-todo" data-view="todo"></section>
      <section class="view" id="view-stocks" data-view="stocks"></section>
      <section class="view" id="view-weather" data-view="weather"></section>
      <section class="view view--bleed" id="view-photos" data-view="photos"></section>
      <div class="banners" id="banners"></div>
    </main>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="sheet-layer" id="sheetLayer"></div>
    <div class="ambient" id="ambient"></div>
    <div class="night" id="night"></div>
  </div>

  <script>
    // If something goes wrong, say what (tap the red box to hide it) instead of showing a blank screen.
    (function () {
      function show(msg) {
        var b = document.getElementById('errbox');
        if (!b) {
          b = document.createElement('div'); b.id = 'errbox';
          b.style.cssText = 'position:fixed;left:84px;right:8px;bottom:8px;z-index:99999;background:#b00020;color:#fff;font:14px/1.3 monospace;padding:8px 12px;border-radius:8px;white-space:pre-wrap;max-height:40%;overflow:auto';
          b.onclick = function () { b.style.display = 'none'; };
          document.body.appendChild(b);
        }
        b.style.display = 'block'; b.textContent += msg + '\n';
      }
      window.addEventListener('error', function (e) { show('Error: ' + e.message + ' (' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ')'); });
      window.addEventListener('unhandledrejection', function (e) { show('Error: ' + (e.reason && e.reason.message || e.reason)); });
    })();
  </script>
  <script>
    // Wall-display self-healing: if the app bundle failed to load (e.g. a stale page right after a
    // deploy, or a network blip), reload until it starts.
    setTimeout(function () { if (!window.App) location.reload(); }, 10000);
  </script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
